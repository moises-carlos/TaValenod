spring.application.name=tavalendo
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/tavalendo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=http://localhost:3000,http://localhost:19006

admin.email=admin@tavalendo.com
admin.senha=troque-em-producao
admin.nome=Administrador TaValendo

tavalendo.validade.dias-critico=7
tavalendo.validade.dias-atencao=30

security.jwt.secret=${SECURITY_JWT_SECRET:tavalendo-secret-key-padrao-desenvolvimento-2026-com-pelo-menos-32-bytes}
security.jwt.access-expiration-seconds=3600
security.jwt.refresh-expiration-seconds=604800
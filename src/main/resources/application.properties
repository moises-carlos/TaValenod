spring.application.name=tavalendo
server.port=${PORT:8080}

# Configuração do Banco de Dados (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tavalendo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:tavalendo-secret-key-padrao-desenvolvimento-2026}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}

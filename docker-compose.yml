services:
  db:
    image: postgres:16-alpine
    container_name: tavalendo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tavalendo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tavalendo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tavalendo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tavalendo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-tavalendo-secret-key-padrao-desenvolvimento-2026-com-pelo-menos-32-bytes}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tavalendo.com}
      ADMIN_SENHA: ${ADMIN_SENHA:-troque-em-producao}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador TaValendo}

volumes:
  postgres_data: